name: nightly-prices

on:
  schedule:
    # Mon-Fri 22:20 UTC = 23:20 Berlin in winter, 00:20 in summer; always after the US close
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      only_date:
        description: "Force one day (YYYY-MM-DD); empty = backfill the last 10 days"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch daily bars from Alpaca
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ONLY_DATE: ${{ github.event.inputs.only_date }}
        run: python3 fetch_prices.py
      - name: Commit new files
        run: |
          git config user.name "morning-picks-bot"
          git config user.email "morning-picks-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "prices: $(cat data/LATEST.txt)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
