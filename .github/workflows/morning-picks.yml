name: morning-picks

on:
  schedule:
    # Mon-Fri 06:30 UTC = 07:30 Berlin in winter, 08:30 in summer; always before the 15:30 Berlin US open
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Testing only: pick even at or after 15:00 Berlin (sets FORCE=1)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Shared with evening-prices so the two never write data/picks.db at the same time.
concurrency:
  group: picks-db
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the branch HEAD as it is when the job starts, not the triggering commit
      # (github.sha): a run that waited in the picks-db queue must see the DB the previous
      # run just pushed (else e.g. a queued manual picker run would miss today's runs row).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If this step fails (e.g. the API call fails after retries), the job stops here
      # and nothing is committed.
      - name: Ask Claude for picks (paper only, no orders)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python -m app.picker

      - name: Commit data/ if changed
        run: |
          git config user.name "morning-picks-bot"
          git config user.email "morning-picks-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "picks: $(TZ=Europe/Berlin date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
