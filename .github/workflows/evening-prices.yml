name: evening-prices

on:
  schedule:
    # Mon-Fri 22:20 UTC = 23:20 Berlin in winter, 00:20 in summer; always after the US close
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Shared with morning-picks so the two never write data/picks.db at the same time.
concurrency:
  group: picks-db
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the branch HEAD as it is when the job starts, not the triggering commit
      # (github.sha): a run that waited in the picks-db queue must see the DB the previous
      # run just pushed (else e.g. a queued manual picker run would miss today's runs row).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exits non-zero only if QQQ could not be downloaded; then nothing is committed
      # and the failed run shows up in the Actions tab.
      - name: Download prices, score picks, write report
        run: python -m app.prices

      - name: Commit data/ if changed
        run: |
          git config user.name "morning-picks-bot"
          git config user.email "morning-picks-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "prices: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
